server:
  port: 8081

spring:
  application:
    name: jobtracker
  docker:
    compose:
      enabled: false          # we start Docker ourselves
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/jobtracker
    username: jobtracker
    password: jobtracker123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: never   # V10 (Flyway) creates the Batch tables
    job:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    model:
      chat: none              # no AI by default; profiles "local" (Ollama) and "cloud" (Anthropic) switch it on
    retry:
      # Spring AI's default would be 10 attempts with up to 3 minutes between them; our requests time out after 30 s
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
      on-client-errors: false # 4xx (bad key, request too large) is never retried
  kafka:
    # explicit, because Docker Compose support is disabled (compose.yaml publishes Kafka on 9092)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      # value serializer: set in KafkaConfig (JSON for events, raw bytes for dead letters)
    consumer:
      group-id: history
      auto-offset-reset: earliest
      # a message that isn't valid JSON must not block the partition: ErrorHandlingDeserializer turns it
      # into an error the DefaultErrorHandler sends straight to the DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: de.zbidi.jobtracker.jobapplication.StatusChangedEvent
        spring.json.use.type.headers: false

jobtracker:
  jwt:
    issuer: jobtracker
    ttl: 1h
    # RSA key pair, never committed. Production: EITHER mounted secret files (preferred) OR inline PEM env vars.
    # Files: JOBTRACKER_JWT_PUBLIC_KEY_LOCATION=file:/run/secrets/jwt-public.pem (+ _PRIVATE_KEY_LOCATION)
    # Inline: JOBTRACKER_JWT_PUBLIC_KEY / JOBTRACKER_JWT_PRIVATE_KEY containing the PEM text
    # Nothing set (dev): a temporary key pair is generated at startup; tokens don't survive a restart.
    public-key: ${JOBTRACKER_JWT_PUBLIC_KEY:}
    private-key: ${JOBTRACKER_JWT_PRIVATE_KEY:}
    public-key-location: ${JOBTRACKER_JWT_PUBLIC_KEY_LOCATION:}
    private-key-location: ${JOBTRACKER_JWT_PRIVATE_KEY_LOCATION:}
  imports:
    # uploaded CSVs are kept here: a restart reads the same file again
    directory: ${JOBTRACKER_IMPORTS_DIRECTORY:${java.io.tmpdir}/jobtracker-imports}
  reminder:
    # APPLIED applications unchanged for this long get one ReminderEvent; checked daily at 08:00 (Europe/Berlin)
    after: 14d
    cron: ${JOBTRACKER_REMINDER_CRON:0 0 8 * * *}
  ai:
    timeout: 30s              # hard limit per analysis, whatever the provider does
  matching:
    # postingMatchJob: at most this many AI analyses per run (each takes 10-30 s with the local model)
    max-per-run: 50
    notify-score: 75                # a result at or above this score is announced (Kafka posting-matches) ...
    auto-create-application: true   # ... and becomes a SAVED application for that user
  jobs:
    # daily fetch from the job portals; new postings then go to the AI matching. "-" switches it off
    fetch-cron: ${JOBTRACKER_JOBS_FETCH_CRON:0 0 7 * * *}
    keywords: Java, Spring          # a posting is kept if it mentions one of them
    max-per-source: 30              # per portal and run (each posting costs AI time later)
    arbeitnow:                      # free public API, no key; "please do not abuse": few pages
      enabled: true
      base-url: https://www.arbeitnow.com
      pages: 2
    bundesagentur:                  # Jobsuche API of the Bundesagentur fuer Arbeit (community-documented)
      enabled: true
      base-url: https://rest.arbeitsagentur.de/jobboerse/jobsuche-service
      api-key: jobboerse-jobsuche   # public client id the API expects, not a secret
      was: Java Entwickler
      wo: Berlin
      umkreis: 50                   # km around "wo"
      published-within-days: 1
      request-delay: 200ms          # pause between detail requests

management:
  endpoints:
    web:
      exposure:
        include: health,metrics   # /actuator/metrics needs a token; e.g. /actuator/metrics/jobtracker.ai.tokens
