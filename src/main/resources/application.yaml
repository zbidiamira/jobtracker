server:
  port: 8081

spring:
  application:
    name: jobtracker
  docker:
    compose:
      enabled: false          # we start Docker ourselves
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/jobtracker
    username: jobtracker
    password: jobtracker123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  kafka:
    # explicit, because Docker Compose support is disabled (compose.yaml publishes Kafka on 9092)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      # value serializer: set in KafkaConfig (JSON for events, raw bytes for dead letters)
    consumer:
      group-id: history
      auto-offset-reset: earliest
      # a message that isn't valid JSON must not block the partition: ErrorHandlingDeserializer turns it
      # into an error the DefaultErrorHandler sends straight to the DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: de.zbidi.jobtracker.jobapplication.StatusChangedEvent
        spring.json.use.type.headers: false

jobtracker:
  jwt:
    issuer: jobtracker
    ttl: 1h
    # RSA key pair, never committed. Production: EITHER mounted secret files (preferred) OR inline PEM env vars.
    # Files: JOBTRACKER_JWT_PUBLIC_KEY_LOCATION=file:/run/secrets/jwt-public.pem (+ _PRIVATE_KEY_LOCATION)
    # Inline: JOBTRACKER_JWT_PUBLIC_KEY / JOBTRACKER_JWT_PRIVATE_KEY containing the PEM text
    # Nothing set (dev): a temporary key pair is generated at startup; tokens don't survive a restart.
    public-key: ${JOBTRACKER_JWT_PUBLIC_KEY:}
    private-key: ${JOBTRACKER_JWT_PRIVATE_KEY:}
    public-key-location: ${JOBTRACKER_JWT_PUBLIC_KEY_LOCATION:}
    private-key-location: ${JOBTRACKER_JWT_PRIVATE_KEY_LOCATION:}
